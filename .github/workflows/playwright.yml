name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    lint-and-format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: 'npm'
            - run: npm ci
            - name: Run ESLint
              run: npm run lint
            - name: Check Code Formatting (Prettier)
              run: npm run format:check

    test:
        needs: lint-and-format
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            # 1. Клонируем приложение (публичный репозиторий)
            - name: Checkout application
              uses: actions/checkout@v4
              with:
                  repository: Gygamyt/site_4_interns
                  path: ./app

            # 2. Устанавливаем pnpm (приложение использует pnpm)
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            # 3. Настраиваем Node.js для приложения (с кешированием pnpm)
            - name: Setup Node for app
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'
                  cache-dependency-path: './app/pnpm-lock.yaml'

            # 4. Устанавливаем docker-compose (т.к. на раннере его нет)
            - name: Install docker-compose
              run: |
                  sudo apt-get update
                  sudo apt-get install -y docker-compose

            # ---- Поэтапная установка вместо full-setup ----
            - name: Install app dependencies
              run: |
                  cd ./app
                  pnpm install

            - name: Generate environment files
              run: |
                  cd ./app
                  pnpm gen:envs

            - name: Start containers
              run: |
                  cd ./app
                  docker-compose up -d

            - name: Wait for database
              run: |
                  cd ./app
                  echo "Waiting for Postgres..."
                  for i in {1..30}; do
                    if docker-compose exec -T postgres pg_isready -U postgres > /dev/null 2>&1; then
                      echo "Postgres is ready!"
                      break
                    fi
                    sleep 2
                  done

            # ---- Сидирование БЕЗ TTY (ключ -T) ----
            - name: Seed database
              run: |
                  cd ./app
                  docker-compose exec -T api pnpm --filter api seed

            - name: Wait for services (API & Frontend)
              run: |
                  echo "Waiting for API (port 3000)..."
                  for i in {1..40}; do
                    if curl -s http://localhost:3000/api-docs > /dev/null; then
                      echo "API is up!"
                      break
                    fi
                    sleep 3
                  done
                  echo "Waiting for Frontend (port 5173)..."
                  for i in {1..40}; do
                    if curl -s http://localhost:5173 > /dev/null; then
                      echo "Frontend is up!"
                      break
                    fi
                    sleep 3
                  done

            - name: Run Playwright tests
              run: npx playwright test
              if: always()

            - run: npm install -g allure-commandline

            - run: allure generate allure-results --clean -o allure-report

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: allure-report
                  path: allure-report

    deploy-report:
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: allure-report
                  path: allure-report

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./allure-report
                  publish_branch: gh-pages
                  keep_files: true
                  force_orphan: true
