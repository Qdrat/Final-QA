name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    lint-and-format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: 'npm'
            - run: npm ci
            - name: Run ESLint
              run: npm run lint
            - name: Check Code Formatting (Prettier)
              run: npm run format:check

    test:
        needs: lint-and-format
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            # 1. Клонируем приложение (публичный репозиторий)
            - name: Checkout application
              uses: actions/checkout@v4
              with:
                  repository: Qdrat/site_4_interns-feature-intermediate_version
                  path: ./app

            # 2. Устанавливаем pnpm (приложение использует pnpm)
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            # 3. Настраиваем Node.js для приложения (с кешированием pnpm)
            - name: Setup Node for app
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'
                  cache-dependency-path: './app/pnpm-lock.yaml'

            # 4. Устанавливаем docker-compose (т.к. на раннере его нет)
            - name: Install docker-compose
              run: |
                  sudo apt-get update
                  sudo apt-get install -y docker-compose

            - name: Patch app scripts to disable TTY for docker-compose exec
              run: |
                  grep -rl "docker-compose exec" ./app --include="*.mjs" --include="*.js" --include="*.cjs" --include="*.sh" | while read -r file; do
                    echo "Patching: $file"
                    sed -i -E 's/docker-compose exec (-T )?/docker-compose exec -T /g' "$file"
                  done

            - name: Full setup of application
              run: |
                  cd ./app
                  pnpm full-setup
              env:
                  CI: true

            # 6. Ждём, пока сервисы поднимутся (проверяем health-эндпоинты)
            - name: Wait for services to be ready
              run: |
                  for i in {1..30}; do
                    if curl -sf http://localhost:3000 > /dev/null; then
                      echo "Frontend is up"
                      break
                    fi
                    echo "Waiting for frontend... ($i)"
                    sleep 2
                  done

            - name: Run Playwright tests
              run: npx playwright test
              if: always()

            - run: npm install -g allure-commandline

            - run: allure generate allure-results --clean -o allure-report

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: allure-report
                  path: allure-report

    deploy-report:
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: allure-report
                  path: allure-report

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./allure-report
                  publish_branch: gh-pages
                  keep_files: true
                  force_orphan: true

    notify-telegram:
        needs: [test, deploy-report]
        runs-on: ubuntu-latest
        if: always()
        steps:
            - name: Send Telegram notification
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  TEST_RESULT: ${{ needs.test.result }}
                  REPO: ${{ github.repository }}
                  BRANCH: ${{ github.ref_name }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  REPO_OWNER="${REPO%%/*}"
                  REPO_NAME="${REPO##*/}"
                  REPORT_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/"

                  if [ "$TEST_RESULT" = "success" ]; then
                    EMOJI="✅"
                    STATUS_TEXT="Тесты пройдены успешно"
                  else
                    EMOJI="❌"
                    STATUS_TEXT="Тесты упали (статус: ${TEST_RESULT})"
                  fi

                  MESSAGE=$(cat <<EOF
                  ${EMOJI} *Playwright Tests* — ${STATUS_TEXT}

                  Репозиторий: \`${REPO}\`
                  Ветка: \`${BRANCH}\`

                  [Allure-отчет](${REPORT_URL})
                  [Лог запуска](${RUN_URL})
                  EOF
                  )

                  curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -d chat_id="${TELEGRAM_CHAT_ID}" \
                    -d parse_mode="Markdown" \
                    --data-urlencode text="${MESSAGE}"
